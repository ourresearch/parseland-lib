name: Deploy to Amazon ECS
on:
  push:
    # gate-proof/** branches run the gate only (never deploy): how a change is tested against it off main.
    branches: [ "main", "gate-proof/**" ]

# One run at a time per branch, so the gate always compares against the commit actually in production.
concurrency:
  group: parseland-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: parseland
  ECS_SERVICE: parseland
  ECS_CLUSTER: parseland
  TASK_FAMILY: parseland
  CONTAINER_NAME: parseland

jobs:
  # The test gate (oxjob #1791; rules in gate/README.md). The deploy below runs only if it passes:
  # offline unit tests, then the sealed holdout scored for this commit and for the commit now in ECS.
  gate:
    name: Test gate
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 40

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install
      run: pip install -r requirements.txt -r gate/requirements.txt

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Fetch the frozen corpus
      env:
        PARSELAND_HOLDOUT_KEY: ${{ secrets.PARSELAND_HOLDOUT_KEY }}
      run: |
        python gate/corpus.py fetch dev
        python gate/corpus.py fetch holdout

    - name: Find the commit in production
      id: prod
      run: |
        IMAGE=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query 'taskDefinition.containerDefinitions[0].image' --output text)
        PROD_SHA="${IMAGE##*:}"
        if ! git cat-file -e "${PROD_SHA}^{commit}" 2>/dev/null; then PROD_SHA="${{ github.event.before }}"; fi
        echo "PROD_SHA=$PROD_SHA" >> "$GITHUB_ENV"
        git worktree add --detach "$RUNNER_TEMP/prod" "$PROD_SHA"
        echo "Comparing ${{ github.sha }} with production $PROD_SHA" >> "$GITHUB_STEP_SUMMARY"

    - name: Unit tests (network off)
      env:
        GATE_REQUIRE_CORPUS: "1"
        GATE_DEV_SCORES_OUT: ${{ runner.temp }}/dev_scores.ndjson
      run: python -m pytest tests gate/test_gate.py -q --disable-socket -p no:cacheprovider

    - name: Ledger guard (a regression written into the ledger is still a regression)
      if: ${{ !cancelled() && steps.prod.outcome == 'success' }}
      run: |
        git show "${PROD_SHA}:gate/known_failures.json" > "$RUNNER_TEMP/prod_ledger.json" 2>/dev/null || true
        python gate/ledger.py guard --base "$RUNNER_TEMP/prod_ledger.json"

    - name: Holdout gate
      if: ${{ !cancelled() && steps.prod.outcome == 'success' }}
      run: |
        H=$(python gate/corpus.py path holdout)
        T="$RUNNER_TEMP/gate"; mkdir -p "$T"
        # Production's scores: reuse the ones saved by the run that deployed it, if scorer and corpus are unchanged.
        if git diff --quiet "$PROD_SHA" HEAD -- gate/score.py gate/fields.py gate/corpus.lock.json \
           && aws s3 cp --quiet "s3://openalex-parseland-gate/runs/$PROD_SHA/head_scores.ndjson" "$T/prod_scores.ndjson" 2>/dev/null; then
          echo "Production scores reused from its own gate run." >> "$GITHUB_STEP_SUMMARY"
        else
          python gate/run_parser.py --lib "$RUNNER_TEMP/prod" --corpus "$H" --out "$T/prod_parsed.ndjson"
          python gate/score.py --corpus "$H" --parsed "$T/prod_parsed.ndjson" --out "$T/prod_scores.ndjson"
        fi
        # This commit's scores: identical to production's when neither parser code nor its pins changed.
        if git diff --quiet "$PROD_SHA" HEAD -- parseland_lib requirements.txt gate/score.py gate/fields.py gate/corpus.lock.json; then
          cp "$T/prod_scores.ndjson" "$T/head_scores.ndjson"
          echo "No parser change since production: holdout scores carried over." >> "$GITHUB_STEP_SUMMARY"
        else
          python gate/run_parser.py --lib . --corpus "$H" --out "$T/head_parsed.ndjson"
          python gate/score.py --corpus "$H" --parsed "$T/head_parsed.ndjson" --out "$T/head_scores.ndjson"
        fi
        OVERRIDE=$(git log -1 --format=%B | sed -n 's/^Gate-Override: *//p' | head -1)
        python gate/compare.py --base "$T/prod_scores.ndjson" --head "$T/head_scores.ndjson" \
          --baseline gate/baseline.json --summary "$GITHUB_STEP_SUMMARY" --json "$T/gate.json" \
          ${OVERRIDE:+--override "$OVERRIDE"}

    - name: Keep the result (private bucket, counts and per-page scores)
      if: always()
      run: |
        T="$RUNNER_TEMP/gate"; mkdir -p "$T"
        if [ -f "$RUNNER_TEMP/dev_scores.ndjson" ]; then cp "$RUNNER_TEMP/dev_scores.ndjson" "$T/"; fi
        for f in gate.json head_scores.ndjson prod_scores.ndjson dev_scores.ndjson; do
          if [ -f "$T/$f" ]; then aws s3 cp --quiet "$T/$f" "s3://openalex-parseland-gate/runs/${{ github.sha }}/$f"; fi
        done

  deploy:
    name: Deploy
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and Push Docker Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

    - name: Retrieve Current Task Definition
      id: get-task-def
      run: |
        aws ecs describe-task-definition --task-definition $TASK_FAMILY --query taskDefinition > task-def.json

    - name: Update Task Definition with New Image
      id: update-task-def
      run: |
        NEW_TASK_DEF=$(jq --arg IMAGE "$IMAGE_URI" \
          '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
          task-def.json)

        echo "$NEW_TASK_DEF" > new-task-def.json

        NEW_TASKDEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)

        echo "NEW_TASKDEF_ARN=$NEW_TASKDEF_ARN" >> $GITHUB_ENV

    - name: Deploy New Task Definition to ECS Service
      run: |
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --task-definition $NEW_TASKDEF_ARN \
          --force-new-deployment
